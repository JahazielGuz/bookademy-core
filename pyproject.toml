[project]
name = "bookademy-core"
version = "0.1.0"
description = "Accounts, documents, generated curriculum and learner progress."
requires-python = ">=3.12"
dependencies = [
    "django[argon2]>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.6",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "django-environ>=0.11",
    # Deployment: gunicorn serves the app, whitenoise serves Django admin's static
    # files without a separate web server or bucket in front.
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    # Uploaded PDFs go to object storage in production: the web process and the
    # worker are separate machines and do not share a filesystem.
    "django-storages[s3]>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
exclude = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
